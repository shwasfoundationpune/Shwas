<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coming Soon | Shwas Foundation</title>
<meta name="description" content="Shwas Foundation — Coming Soon. Launching on Sunday (Auspicious 1st day of Navratri).">
<meta name="theme-color" content="#173e32">
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f7ef;color:#173e32;font-family:Arial,sans-serif;min-height:100svh;display:flex;flex-direction:column}
main{flex:1;display:grid;place-items:center;padding:48px 24px;text-align:center;background:radial-gradient(ellipse at 50% 0%,#e5ebda 0%,transparent 65%)}
.card{width:100%;max-width:780px}
.logo{width:170px;height:120px;object-fit:contain;mix-blend-mode:multiply;margin-bottom:26px}
.eyebrow{text-transform:uppercase;letter-spacing:.24em;font-size:12px;font-weight:700;margin:0 0 24px}
.ornament{display:flex;align-items:center;justify-content:center;gap:16px;color:#a57b2b;margin:26px auto}
.ornament:before,.ornament:after{content:"";width:64px;height:1px;background:#bca46b}
h1{font:normal clamp(56px,10vw,94px)/1.08 Georgia,serif;letter-spacing:-.04em;margin:0}
.launch{font:normal clamp(25px,5vw,36px)/1.4 Georgia,serif;margin:24px 0 8px}
.occasion{font-size:clamp(15px,3vw,19px);line-height:1.6;color:#566849;margin:0}
.tagline{margin:34px 0 0;font-size:14px;line-height:1.8;color:#61715e}
footer{text-align:center;padding:24px;border-top:1px solid #d9dfd0;font-size:12px;letter-spacing:.08em;color:#61715e}
@media(max-width:480px){main{padding:36px 22px}.logo{width:145px;height:103px}.eyebrow{font-size:11px;letter-spacing:.18em}.tagline{margin-top:28px}}
</style>
</head>
<body>
<main><section class="card" aria-labelledby="title">
<img class="logo" src="assets/logo.jpg" alt="Shwas Foundation — Protecting Nature, Serving Humanity">
<p class="eyebrow">Shwas Foundation · Pimpri, Pune</p>
<h1 id="title">Coming Soon</h1>
<div class="ornament" aria-hidden="true">✦</div>
<p class="launch">Launching on Sunday</p>
<p class="occasion">(Auspicious 1st day of Navratri)</p>
<p class="tagline">Protecting Nature, Serving Humanity.</p>
</section></main>
<footer>© 2026 Shwas Foundation</footer>
</body>
</html>
